concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: test

'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
  workflow_dispatch: null
  workflow_call: null

permissions:
  contents: read

jobs:
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  lint:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: test / lint
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          cache: lint
      # `cargo fmt --all` is deliberately not used: it would reformat the
      # vendored src/lib.rs. See scripts/fmt.sh.
      - name: Format
        run: ./scripts/fmt.sh --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        run: cargo doc --workspace --no-deps

  fidelity:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: test / upstream fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The correctness claim for this crate is that src/lib.rs *is* Project
      # Nayuki's reference implementation. This job keeps that true: any edit
      # to the QR algorithm fails unless it is recorded as a deliberate
      # divergence in scripts/upstream.expected.diff.
      - name: Verify src/lib.rs matches upstream qrcodegen
        run: ./scripts/verify-upstream-fidelity.sh

  rust:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: test / rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          cache: test
      - run: cargo test --workspace

  wasm:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: test / wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          cache: wasm
      - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # The npm package exactly as release.yml builds it (wasm-opt -Oz, see
      # wasm/Cargo.toml).
      - name: Build npm package
        run: wasm-pack build wasm --release --target bundler --scope molcrafts --out-name molqrc
      # Guards against a wasm-bindgen / wasm-opt regression silently corrupting
      # the module grid handed to downstream JavaScript.
      - name: Verify wasm matches native output
        run: ./scripts/verify-wasm-parity.sh

  workflow-policy:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  result:
    name: test / result
    needs: [context, lint, fidelity, rust, wasm, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
