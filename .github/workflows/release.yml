concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
name: release

# A v* tag pushed to MolCrafts re-runs test.yml on the tagged tree, checks the
# tag against Cargo.toml and publishes the `molqrc` crate to crates.io and the
# wasm bindings to npm (`.github/release.toml`). workflow_dispatch is the dry
# run: everything but the uploads.
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  context:
    permissions:
      contents: read
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  # Never publish a release that fails the correctness guarantees (format,
  # clippy, tests and the Nayuki conformance suite on every OS, wasm/native parity).
  verify:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: release / verify
    uses: ./.github/workflows/test.yml
    secrets: inherit

  version:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: release / version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tag matches the crate versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for pkg in molqrc molqrc-wasm; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ${pkg} version ${version}"
              exit 1
            fi
          done

  crate-check:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: release / crate (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # Only the root `molqrc` crate goes to crates.io; molqrc-wasm ships to npm.
      - run: cargo publish --locked -p molqrc --dry-run

  npm-pack:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: release / npm (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          cache: release-wasm
      - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - name: Build
        run: wasm-pack build wasm --release --target bundler --scope molcrafts --out-name molqrc
      - name: Pack
        working-directory: wasm/pkg
        run: npm pack --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-pkg
          path: wasm/pkg
          if-no-files-found: error

  crates:
    name: release / crates.io
    needs:
    - context
    - verify
    - version
    - crate-check
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # --locked publishes exactly the dependency set that was tested.
      - name: Publish
        run: cargo publish --locked -p molqrc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: release / npm
    needs:
    - context
    - verify
    - version
    - npm-pack
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-pkg
          path: wasm/pkg
      - name: Publish
        working-directory: wasm/pkg
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
