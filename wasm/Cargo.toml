[package]
name = "molqrc-wasm"
version = "0.1.1"
edition = "2021"
description = "WebAssembly bindings for the molqrc QR Code generator"
license = "BSD-3-Clause"
repository = "https://github.com/MolCrafts/molqrc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
molqrc = { path = ".." }
wasm-bindgen = "=0.2.114"
