[package]
name = "molqrc"
version = "0.2.0"
edition = "2021"
description = "QR Code generator library, conformance-tested against Project Nayuki's qrcodegen"
homepage = "https://github.com/MolCrafts/molqrc"
repository = "https://github.com/MolCrafts/molqrc"
readme = "README.md"
keywords = ["qr-code", "barcode", "encoder", "image"]
categories = ["encoding", "multimedia::images"]
# The engine (src/) is derived from Project Nayuki's qrcodegen and stays under
# its MIT licence; everything else is BSD-3-Clause. See LICENSE.
license = "MIT AND BSD-3-Clause"
# The web demo carries a committed wasm build; keeping it out of the crate
# tarball avoids shipping a binary artifact to crates.io. tests/ needs the git
# dev-dependency, which the published manifest drops.
exclude = ["molqrc_web/", ".github/", ".claude/", "CLAUDE.md", "scripts/", "tests/", "**/.DS_Store"]

[lib]
name = "molqrc"

[workspace]
members = ["wasm"]

[dev-dependencies]
# The reference implementation the engine is checked against
# (tests/conformance.rs). Pinned to an upstream commit; a dev-dependency
# without a version is dropped from the published manifest.
qrcodegen = { git = "https://github.com/nayuki/QR-Code-generator", rev = "bcfe1b018cec5f1f91b5705eca5bb4cdd34e9f8d" }
